<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMINA CANDLES | Check out</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/550da1d535.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="style.css" />

    <style>
        .error-text { color: #dc3545; font-size: 0.85rem; display: none; }
        .btn-custom { background-color: #8e7d66; color: white; border: none; }
        .btn-custom:hover { background-color: #6d5f4d; color: white; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #d8c3a5">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"><strong>LUMINA CANDLES</strong></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contactUs.html">Contact Us</a>
            </li>
          </ul>

          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="cart.html">
                <span><i class="fas fa-shopping-cart"></i></span>
                <span class="badge badge-pill bg-danger">2</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container" style="margin-top: 5%">
      <div class="row">
        <div class="col-md-4 order-md-2 mb-4">
          <h4 class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">Your cart</span>
            <span class="badge badge-secondary badge-pill" style="color: grey">2</span>
          </h4>
          <ul class="list-group mb-3" id="checkoutCart"></ul>
        </div>
        <div class="col-md-8 order-md-1">
          <h4 class="mb-3">Shipping address</h4>
          <form id="checkoutForm" novalidate="">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="firstName">First name</label>
                <input type="text" class="form-control" id="firstName" required="" />
                <div id="nameError" class="error-text">Valid first name is required.</div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="lastName">Last name</label>
                <input type="text" class="form-control" id="lastName" required="" />
              </div>
            </div>

            <div class="mb-3">
              <label for="email">Email </label>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" />
            </div>

            <div class="mb-3">
              <label for="address">Address</label>
              <input type="text" class="form-control" id="address" placeholder="1234 Main St" required="" />
              <div id="addressError" class="error-text">Please enter your shipping address.</div>
            </div>

            <div class="row">
              <div class="col-md-5 mb-3">
                <label for="country">Country</label>
                <select class="form-select d-block w-100" id="country" required="">
                  <option value="">Choose...</option>
                  <option>Saudi Arabia</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label for="City">City</label>
                <select class="form-select d-block w-100" id="City" required="">
                  <option value="">Choose...</option>
                  <option>Dammam</option>
                  <option>Khobar</option>
                  <option>Dhahran</option>
                </select>
              </div>
            </div>

            <hr class="mb-4" />
            <h4 class="mb-3">Payment</h4>
            <div class="d-block my-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="pay" id="cod" checked />
                <label class="form-check-label" for="cod">Cash on Delivery</label>
              </div>
            </div>

            <hr class="mb-4" />
            <button class="btn btn-custom btn-lg w-100" type="submit">Place Order</button>
          </form>
        </div>
      </div>

      <div style="margin-top: 10%"></div>
    </div>

    <footer class="text-center py-3 fixed-bottom" style="background-color: #d8c3a5">
        <p class="mb-0">© 2026 LUMINA CANDLES | Lana, Zainab, Eiman, Miad</p>
    </footer>

    <script>
document.addEventListener('DOMContentLoaded', function () {

    const cartContainer = document.getElementById('checkoutCart');
    const cartBadge = document.querySelector('.badge.bg-danger');

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function updateBadge() {
        if (cartBadge) {
            cartBadge.textContent = cart.reduce((total, item) => total + item.quantity, 0);
        }
    }

    function renderCheckout() {

        if (cart.length === 0) {
            cartContainer.innerHTML = `
                <li class="list-group-item text-center">
                    Your cart is empty
                </li>`;
            return;
        }

        let total = 0;
        let html = "";

        cart.forEach(item => {

            // extract number from "45.00 SAR"
            let priceNumber = parseFloat(item.price);

            let itemTotal = priceNumber * item.quantity;
            total += itemTotal;

            html += `
                <li class="list-group-item d-flex justify-content-between lh-condensed">
                    <div>
                        <h6 class="my-0">${item.name}</h6>
                        <small class="text-muted">Qty: ${item.quantity}</small>
                    </div>
                    <span class="text-muted">${itemTotal.toFixed(2)} SAR</span>
                </li>
            `;
        });

        html += `
            <li class="list-group-item d-flex justify-content-between">
                <span>Total (SAR)</span>
                <strong>${total.toFixed(2)} SAR</strong>
            </li>
        `;

        cartContainer.innerHTML = html;
    }

    // FORM VALIDATION (your original logic kept)
    document.getElementById('checkoutForm').addEventListener('submit', function(e) {
        e.preventDefault();

        let valid = true;
        const name = document.getElementById('firstName').value;
        const address = document.getElementById('address').value;

        if(name.trim() === "") {
            document.getElementById('nameError').style.display = 'block';
            valid = false;
        } else {
            document.getElementById('nameError').style.display = 'none';
        }

        if(address.trim() === "") {
            document.getElementById('addressError').style.display = 'block';
            valid = false;
        } else {
            document.getElementById('addressError').style.display = 'none';
        }

        if(valid) {
            alert("Thank you for shopping with LUMINA CANDLES! ✨\nYour order has been placed.");

            // OPTIONAL: clear cart after order
            localStorage.removeItem('cart');

            window.location.href = "index.html";
        }
    });

    updateBadge();
    renderCheckout();

});
</script>
  </body>
</html>
