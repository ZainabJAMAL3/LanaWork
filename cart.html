<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA CANDLES | Shopping Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/550da1d535.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="style.css">

    <style>
        .cart-container { margin-bottom: 120px; }
        .product-img { max-width: 80px; border-radius: 8px; }
        .quantity-input { width: 60px; text-align: center; }
        .btn-link { color: #8e7d66; text-decoration: none; }
        .btn-link:hover { color: #6d5f4d; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light shadow-sm" style="background-color: #d8c3a5">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"><strong>LUMINA CANDLES</strong></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contactUs.html">Contact Us</a></li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" href="cart.html">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartBadge" class="badge bg-danger">0</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="cart-container mt-5">
      <div class="container">
        <div class="row d-flex justify-content-center">
          <div class="col-md-10">
            <h3 class="mb-4" style="color: #8e7d66;">Shopping Cart</h3>

            <div class="card rounded-3 mb-4 shadow-sm border-0">
              <div class="card-body p-4">
                <div class="row d-flex justify-content-between align-items-center">
                  <div class="col-md-2">
                    <img src="images/Lavender Dream.jpeg" class="product-img" alt="Lavender Dream">
                  </div>
                  <div class="col-md-3">
                    <p class="lead fw-bold mb-1">Lavender Dream</p>
                    <p class="text-muted small mb-0">Scent: Soothing Lavender</p>
                  </div>
                  <div class="col-md-3 d-flex align-items-center justify-content-center">
                    <button class="btn btn-link px-2" onclick="this.parentNode.querySelector('input').stepDown()">
                        <i class="fas fa-minus"></i>
                    </button>
                    <input min="1" name="quantity" value="1" type="number" class="form-control form-control-sm quantity-input" />
                    <button class="btn btn-link px-2" onclick="this.parentNode.querySelector('input').stepUp()">
                        <i class="fas fa-plus"></i>
                    </button>
                  </div>
                  <div class="col-md-2 text-center">
                    <h5 class="mb-0">45.00 SAR</h5>
                  </div>
                  <div class="col-md-1 text-end">
                    <a href="#!" class="text-danger remove-item-btn"><i class="fas fa-trash fa-lg"></i></a>
                  </div>
                </div>
              </div>
            </div>

            <div class="card rounded-3 mb-4 shadow-sm border-0">
              <div class="card-body p-4">
                <div class="row d-flex justify-content-between align-items-center">
                  <div class="col-md-2">
                    <img src="images/Ocean Breeze.jpeg" class="product-img" alt="Ocean Breeze">
                  </div>
                  <div class="col-md-3">
                    <p class="lead fw-bold mb-1">Ocean Breeze</p>
                    <p class="text-muted small mb-0">Scent: Fresh Sea Salt</p>
                  </div>
                  <div class="col-md-3 d-flex align-items-center justify-content-center">
                    <button class="btn btn-link px-2" onclick="this.parentNode.querySelector('input').stepDown()">
                        <i class="fas fa-minus"></i>
                    </button>
                    <input min="1" name="quantity" value="1" type="number" class="form-control form-control-sm quantity-input" />
                    <button class="btn btn-link px-2" onclick="this.parentNode.querySelector('input').stepUp()">
                        <i class="fas fa-plus"></i>
                    </button>
                  </div>
                  <div class="col-md-2 text-center">
                    <h5 class="mb-0">40.00 SAR</h5>
                  </div>
                  <div class="col-md-1 text-end">
                    <a href="#!" class="text-danger remove-item-btn"><i class="fas fa-trash fa-lg"></i></a>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end mt-4">
              <a href="checkOut.html" class="btn btn-custom btn-lg px-5">Check Out</a>
            </div>
            
          </div>
        </div>
      </div>
    </section>

    <footer class="text-center py-3 fixed-bottom" style="background-color: #d8c3a5">
      <div class="container">
        <p class="mb-0">© 2026 LUMINA CANDLES | Group 6 Project</p>
        <p class="mb-0"><small>Lana, Zainab, Eiman, Miad - IAU CCSIT</small></p>
      </div>
    </footer>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const cartBadge = document.getElementById('cartBadge');
    const cartContainer = document.querySelector('.col-md-10');

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function updateBadge() {
        if (cartBadge) {
            cartBadge.textContent = cart.reduce((total, item) => total + item.quantity, 0);
        }
    }

    function renderCart() {

        if (cart.length === 0) {
            cartContainer.innerHTML = `
                <div class="text-center py-5 shadow-sm bg-white rounded">
                    <i class="fas fa-shopping-basket fa-3x mb-3" style="color: #d8c3a5;"></i>
                    <h4 style="color: #8e7d66;">Your cart is empty</h4>
                    <p class="text-muted">Looks like you haven't added any candles yet.</p>
                    <a href="index.html" class="btn btn-custom mt-3 px-5">Go Shopping</a>
                </div>`;
            return;
        }

        let html = `<h3 class="mb-4" style="color: #8e7d66;">Shopping Cart</h3>`;

        cart.forEach((item, index) => {
            html += `
            <div class="card rounded-3 mb-4 shadow-sm border-0">
              <div class="card-body p-4">
                <div class="row d-flex justify-content-between align-items-center">

                  <div class="col-md-2">
                    <img src="images/${item.name}.jpeg" class="product-img" alt="${item.name}">
                  </div>

                  <div class="col-md-3">
                    <p class="lead fw-bold mb-1">${item.name}</p>
                    <p class="text-muted small mb-0">Scented Candle</p>
                  </div>

                  <div class="col-md-3 d-flex align-items-center justify-content-center">
                    <button class="btn btn-link px-2 decrease-btn" data-index="${index}">
                        <i class="fas fa-minus"></i>
                    </button>

                    <input min="1" value="${item.quantity}" type="number"
                      class="form-control form-control-sm quantity-input text-center" readonly />

                    <button class="btn btn-link px-2 increase-btn" data-index="${index}">
                        <i class="fas fa-plus"></i>
                    </button>
                  </div>

                  <div class="col-md-2 text-center">
                    <h5 class="mb-0">${item.price}</h5>
                  </div>

                  <div class="col-md-1 text-end">
                    <a href="#" class="text-danger remove-item-btn" data-index="${index}">
                      <i class="fas fa-trash fa-lg"></i>
                    </a>
                  </div>

                </div>
              </div>
            </div>`;
        });

        html += `
<div class="d-flex justify-content-between mt-4">

  <button class="btn btn-outline-danger clear-cart-btn">
    <i class="fas fa-trash"></i> Clear Cart
  </button>

  <a href="checkOut.html" class="btn btn-custom btn-lg px-5">Check Out</a>

</div>`;

        cartContainer.innerHTML = html;
    }

    // 🔥 HANDLE ALL BUTTONS (no duplicates)
    document.addEventListener('click', function (e) {
      // Clear Cart
if (e.target.closest('.clear-cart-btn')) {

    if (confirm("Are you sure you want to clear the entire cart?")) {

        localStorage.removeItem('cart');
        cart = [];

        updateBadge();
        renderCart();
    }
}

        const index = e.target.closest('[data-index]')?.dataset.index;
        if (index === undefined) return;

        // Increase
        if (e.target.closest('.increase-btn')) {
            cart[index].quantity++;
        }

        // Decrease
        if (e.target.closest('.decrease-btn')) {
            if (cart[index].quantity > 1) {
                cart[index].quantity--;
            }
        }

        // Remove
        if (e.target.closest('.remove-item-btn')) {
            e.preventDefault();
            if (confirm("Are you sure you want to remove this item?")) {
                cart.splice(index, 1);
            }
        }

        localStorage.setItem('cart', JSON.stringify(cart));
        updateBadge();
        renderCart();
    });

    updateBadge();
    renderCart();

});
</script>
</body>
</html>
