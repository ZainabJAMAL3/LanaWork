<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA CANDLES | Admin Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/550da1d535.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="style.css">

    <style>
        body { background-color: #fdfaf5; }
        .login-box {
            max-width: 400px;
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 100px;
        }
        .login-box header {
            color: #8e7d66;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .btn-admin {
            background-color: #8e7d66;
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px;
            transition: 0.3s;
        }
        .btn-admin:hover { background-color: #6d5f4d; color: #fff; }
        .error-text {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="login-box text-center">
            <i class="fa-solid fa-user-shield fa-3x mb-3" style="color: #8e7d66;"></i>
            <header>Admin Portal</header>

            <form id="adminForm" novalidate>
                <div class="mb-3 text-start">
                    <label class="form-label">Username</label>
                    <input type="text" id="adminUser" class="form-control" placeholder="Enter admin username">
                    <div id="userError" class="error-text">⚠️ Username is required for admin access.</div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label">Password</label>
                    <input type="password" id="adminPass" class="form-control" placeholder="••••••••">
                    <div id="passError" class="error-text">⚠️ Password is required.</div>
                </div>

                <button type="submit" class="btn btn-admin w-100">Login to Dashboard</button>
            </form>

            <div class="mt-4">
                <a href="index.html" class="text-muted small text-decoration-none">← Back to Store</a>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 fixed-bottom" style="background-color: #d8c3a5">
      <div class="container">
        <p class="mb-0">© 2026 LUMINA CANDLES | Secure Admin Access</p>
        <p class="mb-0"><small>Lana, Zainab, Eiman, Miad - IAU CCSIT</small></p>
      </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            const adminForm = document.getElementById('adminForm');

            // Safety Check: Verify if form element exists
            if (adminForm) {
                adminForm.addEventListener('submit', function(e) {
                    e.preventDefault(); // Prevent standard submission to handle logic via JS
                    
                    let isValid = true;
                    const username = document.getElementById('adminUser');
                    const password = document.getElementById('adminPass');

                    // 1. Validation for Admin Username 
                    if (username && username.value.trim() === "") {
                        document.getElementById('userError').style.display = 'block';
                        isValid = false;
                    } else {
                        if(document.getElementById('userError')) document.getElementById('userError').style.display = 'none';
                    }

                    // 2. Validation for Admin Password
                    if (password && password.value.trim() === "") {
                        document.getElementById('passError').style.display = 'block';
                        isValid = false;
                    } else {
                        if(document.getElementById('passError')) document.getElementById('passError').style.display = 'none';
                    }

                    // Final Action: If credentials pass validation
                    if (isValid) {
                        // Display a welcoming message for the admin
                        alert("Access Granted. Welcome to the Management Dashboard! ✨");
                        
                        // Redirect logic (Week 8 BOM: location object)
                        window.location.href = "adminDashboard.html";
                    }
                });
            }
        });
    </script>
</body>
</html>
