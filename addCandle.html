<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMINA CANDLES | Add Candle</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://kit.fontawesome.com/550da1d535.js" crossorigin="anonymous"></script>

<style>
body { background-color: #f8f9fa; }
.btn-custom { background-color: #8e7d66; color: white; }
.btn-custom:hover { background-color: #6d5f4d; }
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light shadow-sm" style="background-color: #d8c3a5">
  <div class="container-fluid">
    <a class="navbar-brand" href="admin.html"><strong>LUMINA CANDLES (Admin)</strong></a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 bg-white p-4 rounded shadow-sm">

            <h4 class="mb-4"><i class="fa fa-plus"></i> Add New Candle</h4>

            <form id="addCandleForm">

                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Size</label>
                    <input type="text" id="size" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Scent</label>
                    <input type="text" id="scent" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Stock</label>
                    <input type="number" id="stock" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Price (SAR)</label>
                    <input type="number" id="price" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Upload Image</label>
                    <input type="file" id="image" class="form-control" accept="image/*" required>
                </div>

                <button class="btn btn-custom w-100">Add Candle</button>
            </form>

        </div>
    </div>
</div>

<footer class="text-center py-3 fixed-bottom" style="background-color: #d8c3a5">
  <div class="container">
    <p class="mb-0">© 2026 LUMINA CANDLES | Admin Panel</p>
    <p class="mb-0"><small>Lana, Zainab, Eiman, Miad - IAU CCSIT</small></p>
  </div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("addCandleForm");

    if (!form) {
        console.error("Form not found!");
        return;
    }

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const file = document.getElementById("image").files[0];

        if (!file) {
            alert("Please upload an image");
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {

            let products = JSON.parse(localStorage.getItem("products")) || [];

            products.push({
                name: document.getElementById("name").value,
                size: document.getElementById("size").value,
                scent: document.getElementById("scent").value,
                stock: document.getElementById("stock").value,
                price: document.getElementById("price").value,
                image: event.target.result
            });

            localStorage.setItem("products", JSON.stringify(products));

            window.location.replace("adminDashboard.html");
        };

        reader.readAsDataURL(file);
    });

});
</script>

</body>
</html>
